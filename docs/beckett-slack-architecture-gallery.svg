<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Beckett Slack architecture</title>
  <desc id="desc">A diagram showing how Slack interactions move through Beckett's secure application, context layer, AI coaching engine, and back into a private Slack thread.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A1917" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#BA7517"/>
    </marker>
    <marker id="arrowMuted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#8A8784"/>
    </marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BA7517"/>
      <stop offset="1" stop-color="#854F0B"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1200" fill="#FBF8F3"/>
  <circle cx="1660" cy="82" r="230" fill="#FAEEDA" opacity="0.72"/>
  <circle cx="82" cy="1130" r="245" fill="#E8F3E8" opacity="0.72"/>

  <text x="90" y="94" fill="#BA7517" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BECKETT</text>
  <text x="90" y="172" fill="#1A1917" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic">How Beckett works inside Slack</text>
  <text x="90" y="222" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="25">Private, context-aware communication coaching without leaving the conversation.</text>

  <!-- Primary request and response path -->
  <path d="M350 430 H414" stroke="#BA7517" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M680 430 H744" stroke="#BA7517" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1010 430 H1074" stroke="#BA7517" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1340 430 H1404" stroke="#BA7517" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="310" width="260" height="240" rx="28" fill="#4A154B"/>
    <circle cx="220" cy="372" r="30" fill="#ECB22E"/>
    <path d="M205 359 h30 v26 h-16 l-10 10 v-10 h-4z" fill="#4A154B"/>
    <text x="220" y="438" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Slack user</text>
    <text x="220" y="480" text-anchor="middle" fill="#F3EDE3" font-family="Arial, Helvetica, sans-serif" font-size="19">Message or conversation</text>
    <text x="220" y="510" text-anchor="middle" fill="#F3EDE3" font-family="Arial, Helvetica, sans-serif" font-size="19">that needs coaching</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="310" width="260" height="240" rx="28" fill="#FFFFFF"/>
    <rect x="420" y="310" width="260" height="13" rx="6" fill="#BA7517"/>
    <circle cx="550" cy="372" r="30" fill="#FAEEDA"/>
    <path d="M537 359 h26 v20 h-15 l-9 9 v-9 h-2z" fill="none" stroke="#BA7517" stroke-width="4" stroke-linejoin="round"/>
    <text x="550" y="438" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Beckett in Slack</text>
    <text x="550" y="480" text-anchor="middle" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="19">Commands • Buttons</text>
    <text x="550" y="510" text-anchor="middle" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="19">Shortcuts • Threads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="310" width="260" height="240" rx="28" fill="#FFFFFF"/>
    <rect x="750" y="310" width="260" height="13" rx="6" fill="#BA7517"/>
    <circle cx="880" cy="372" r="30" fill="#FAEEDA"/>
    <path d="M865 362 h30 M865 372 h30 M865 382 h20" stroke="#BA7517" stroke-width="4" stroke-linecap="round"/>
    <text x="880" y="438" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Beckett app</text>
    <text x="880" y="480" text-anchor="middle" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="19">Next.js APIs on Vercel</text>
    <text x="880" y="510" text-anchor="middle" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="19">Intent + flow orchestration</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="310" width="260" height="240" rx="28" fill="url(#hero)"/>
    <circle cx="1210" cy="372" r="30" fill="#FAEEDA"/>
    <path d="M1198 359 l12 13 12-13 M1198 385 l12-13 12 13" fill="none" stroke="#854F0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1210" y="438" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">AI coaching</text>
    <text x="1210" y="480" text-anchor="middle" fill="#FFF7EA" font-family="Arial, Helvetica, sans-serif" font-size="19">Claude via AWS Bedrock</text>
    <text x="1210" y="510" text-anchor="middle" fill="#FFF7EA" font-family="Arial, Helvetica, sans-serif" font-size="19">Context-aware guidance</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1410" y="310" width="300" height="240" rx="28" fill="#FFFFFF"/>
    <rect x="1410" y="310" width="300" height="13" rx="6" fill="#2D6A2D"/>
    <circle cx="1560" cy="372" r="30" fill="#E8F3E8"/>
    <path d="M1545 370 l10 10 20-23" fill="none" stroke="#2D6A2D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1560" y="438" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Private Slack reply</text>
    <text x="1560" y="480" text-anchor="middle" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="19">Advice and realistic practice</text>
    <text x="1560" y="510" text-anchor="middle" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="19">continue in the same thread</text>
  </g>

  <!-- Context layer -->
  <text x="90" y="672" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Secure context layer</text>
  <text x="390" y="672" fill="#8A8784" font-family="Arial, Helvetica, sans-serif" font-size="20">Beckett uses only the context available for the current experience.</text>
  <line x1="90" y1="698" x2="1710" y2="698" stroke="#D9D3CA" stroke-width="2"/>

  <path d="M250 770 C250 650 880 680 880 560" fill="none" stroke="#8A8784" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <path d="M640 770 C640 650 900 680 900 560" fill="none" stroke="#8A8784" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <path d="M1030 770 C1030 660 1175 670 1190 560" fill="none" stroke="#8A8784" stroke-width="3" marker-end="url(#arrowMuted)"/>
  <path d="M1420 770 C1420 650 1240 670 1230 560" fill="none" stroke="#8A8784" stroke-width="3" marker-end="url(#arrowMuted)"/>

  <g>
    <rect x="90" y="770" width="330" height="178" rx="24" fill="#FFFFFF" stroke="#D9D3CA" stroke-width="2"/>
    <circle cx="134" cy="814" r="20" fill="#FAEEDA"/>
    <path d="M124 808 h20 M124 815 h20 M124 822 h13" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
    <text x="168" y="822" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Conversation context</text>
    <text x="120" y="866" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="18">Selected message and current thread</text>
    <rect x="120" y="891" width="82" height="30" rx="15" fill="#E8F3E8"/>
    <text x="161" y="912" text-anchor="middle" fill="#2D6A2D" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">ALWAYS</text>
  </g>

  <g>
    <rect x="480" y="770" width="330" height="178" rx="24" fill="#FFFFFF" stroke="#D9D3CA" stroke-width="2"/>
    <circle cx="524" cy="814" r="20" fill="#FAEEDA"/>
    <path d="M516 807 h16 v15 h-16z M519 803 h10" fill="none" stroke="#BA7517" stroke-width="3" stroke-linejoin="round"/>
    <text x="558" y="822" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Conversation state</text>
    <text x="510" y="866" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="18">Guest or connected session history</text>
    <text x="510" y="904" fill="#8A8784" font-family="Arial, Helvetica, sans-serif" font-size="16">Securely stored in Supabase</text>
  </g>

  <g>
    <rect x="870" y="770" width="330" height="178" rx="24" fill="#FFFFFF" stroke="#D9D3CA" stroke-width="2"/>
    <circle cx="914" cy="814" r="20" fill="#FAEEDA"/>
    <circle cx="914" cy="808" r="6" fill="none" stroke="#BA7517" stroke-width="3"/>
    <path d="M903 824 c3-8 19-8 22 0" fill="none" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
    <text x="948" y="822" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Beckett profile</text>
    <text x="900" y="866" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="18">Identity and relationship context</text>
    <rect x="900" y="891" width="132" height="30" rx="15" fill="#FAEEDA"/>
    <text x="966" y="912" text-anchor="middle" fill="#854F0B" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CONNECTED</text>
  </g>

  <g>
    <rect x="1260" y="770" width="330" height="178" rx="24" fill="#FFFFFF" stroke="#D9D3CA" stroke-width="2"/>
    <circle cx="1304" cy="814" r="20" fill="#E8EFFE"/>
    <circle cx="1301" cy="811" r="8" fill="none" stroke="#2C4DA3" stroke-width="3"/>
    <path d="M1307 817 l8 8" stroke="#2C4DA3" stroke-width="3" stroke-linecap="round"/>
    <text x="1338" y="822" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Slack RTS context</text>
    <text x="1290" y="866" fill="#4A4845" font-family="Arial, Helvetica, sans-serif" font-size="18">Relevant workspace information</text>
    <rect x="1290" y="891" width="170" height="30" rx="15" fill="#E8EFFE"/>
    <text x="1375" y="912" text-anchor="middle" fill="#2C4DA3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">WHEN AVAILABLE</text>
  </g>

  <rect x="90" y="1024" width="1620" height="92" rx="30" fill="#1A1917"/>
  <text x="900" y="1062" text-anchor="middle" fill="#EF9F27" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ONE PRIVATE COACHING WORKFLOW</text>
  <text x="900" y="1097" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23">Decode  •  Respond  •  Rewrite  •  Prep  •  Practice</text>
</svg>
