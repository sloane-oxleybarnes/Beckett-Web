<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Beckett Slack agent architecture</title>
  <desc id="desc">A simple architecture diagram with Slack, Beckett on Vercel, Supabase, Slack APIs and Real-Time Search, and Claude through AWS Bedrock connected by labeled arrows.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#414141"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2D6A2D"/>
    </marker>
  </defs>

  <rect width="1800" height="1200" fill="#FFFFFF"/>

  <text x="90" y="78" fill="#BA7517" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4">BECKETT</text>
  <text x="90" y="138" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Slack Agent Architecture</text>
  <text x="90" y="178" fill="#626262" font-family="Arial, Helvetica, sans-serif" font-size="21">Private communication coaching powered by Slack context and AI</text>

  <!-- Layer boundaries -->
  <rect x="70" y="235" width="420" height="820" fill="none" stroke="#C9C9C9" stroke-width="2"/>
  <rect x="535" y="235" width="660" height="820" fill="none" stroke="#C9C9C9" stroke-width="2"/>
  <rect x="1240" y="235" width="490" height="820" fill="none" stroke="#C9C9C9" stroke-width="2"/>

  <rect x="70" y="235" width="420" height="52" fill="#F4EDF4"/>
  <rect x="535" y="235" width="660" height="52" fill="#FFF1DD"/>
  <rect x="1240" y="235" width="490" height="52" fill="#EDF6EF"/>
  <text x="90" y="269" fill="#4A154B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">FRONTEND / UI</text>
  <text x="555" y="269" fill="#854F0B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">BACKEND / CORE LOGIC</text>
  <text x="1260" y="269" fill="#2D6A2D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">DATA / EXTERNAL SERVICES</text>

  <!-- Slack node -->
  <g transform="translate(280 480)">
    <rect x="-145" y="-145" width="290" height="290" rx="18" fill="#FFFFFF" stroke="#4A154B" stroke-width="3"/>
    <g transform="translate(0 -42)">
      <rect x="-38" y="5" width="29" height="72" rx="15" fill="#36C5F0"/>
      <circle cx="-23.5" cy="-13" r="14.5" fill="#36C5F0"/>
      <rect x="9" y="-40" width="29" height="72" rx="15" fill="#2EB67D"/>
      <circle cx="56" cy="-25.5" r="14.5" fill="#2EB67D"/>
      <rect x="9" y="43" width="72" height="29" rx="15" fill="#ECB22E"/>
      <circle cx="95" cy="57.5" r="14.5" fill="#ECB22E"/>
      <rect x="-81" y="5" width="72" height="29" rx="15" fill="#E01E5A"/>
      <circle cx="-95" cy="19.5" r="14.5" fill="#E01E5A"/>
    </g>
    <text x="0" y="75" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Slack user</text>
    <text x="0" y="110" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Commands • Buttons • Threads</text>
  </g>

  <!-- Private reply node -->
  <g transform="translate(280 840)">
    <rect x="-145" y="-100" width="290" height="200" rx="18" fill="#FFFFFF" stroke="#2D6A2D" stroke-width="3"/>
    <circle cx="0" cy="-42" r="28" fill="#E8F3E8"/>
    <path d="M-12 -43 l9 10 18-22" fill="none" stroke="#2D6A2D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="15" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Private Slack thread</text>
    <text x="0" y="51" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Advice • Drafts • Practice</text>
  </g>

  <!-- Vercel / API node -->
  <g transform="translate(865 410)">
    <rect x="-210" y="-105" width="420" height="210" rx="18" fill="#FFFFFF" stroke="#1A1917" stroke-width="3"/>
    <path d="M-145 -24 L-112 -82 L-79 -24 Z" fill="#1A1917"/>
    <text x="-47" y="-46" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Beckett API</text>
    <text x="0" y="18" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Next.js on Vercel</text>
    <text x="0" y="55" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Verify request • Route intent</text>
    <text x="0" y="83" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Manage Slack conversation flow</text>
  </g>

  <!-- Beckett coaching engine -->
  <g transform="translate(865 790)">
    <rect x="-230" y="-145" width="460" height="290" rx="18" fill="#FFF8ED" stroke="#BA7517" stroke-width="4"/>
    <text x="0" y="-92" text-anchor="middle" fill="#854F0B" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">BECKETT COACHING ENGINE</text>
    <text x="-180" y="-35" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">1. Assemble context</text>
    <text x="-180" y="5" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">2. Apply coaching framework</text>
    <text x="-180" y="45" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">3. Generate response</text>
    <line x1="-180" y1="78" x2="180" y2="78" stroke="#D9C5A4" stroke-width="2"/>
    <text x="0" y="113" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="17">Decode • Respond • Rewrite • Prep • Practice</text>
  </g>

  <!-- Supabase node -->
  <g transform="translate(1485 395)">
    <rect x="-180" y="-90" width="360" height="180" rx="18" fill="#FFFFFF" stroke="#3ECF8E" stroke-width="3"/>
    <path d="M-122 -52 L-82 -52 L-109 0 L-66 0 L-130 69 L-111 14 L-146 14 Z" fill="#3ECF8E"/>
    <text x="-45" y="-18" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Supabase</text>
    <text x="-45" y="17" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Postgres</text>
    <text x="0" y="62" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="17">Conversation state • Profiles</text>
  </g>

  <!-- Slack API node -->
  <g transform="translate(1485 650)">
    <rect x="-180" y="-90" width="360" height="180" rx="18" fill="#FFFFFF" stroke="#2C4DA3" stroke-width="3"/>
    <text x="0" y="-28" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Slack APIs + RTS</text>
    <text x="0" y="12" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Selected message • Thread history</text>
    <text x="0" y="47" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="18">Real-Time Search when available</text>
  </g>

  <!-- Bedrock node -->
  <g transform="translate(1485 905)">
    <rect x="-180" y="-90" width="360" height="180" rx="18" fill="#FFFFFF" stroke="#FF9900" stroke-width="3"/>
    <text x="0" y="-27" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">AWS Bedrock</text>
    <path d="M-65 -9 C-20 17 25 17 69 -8" fill="none" stroke="#FF9900" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="48" text-anchor="middle" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Claude</text>
    <text x="0" y="76" text-anchor="middle" fill="#5E5B57" font-family="Arial, Helvetica, sans-serif" font-size="17">AI response generation</text>
  </g>

  <!-- Arrows -->
  <path d="M425 430 H655" fill="none" stroke="#414141" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="540" y="405" text-anchor="middle" fill="#414141" font-family="Arial, Helvetica, sans-serif" font-size="16">1. Slack event / HTTPS</text>

  <path d="M865 515 V645" fill="none" stroke="#414141" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="886" y="588" fill="#414141" font-family="Arial, Helvetica, sans-serif" font-size="16">2. Route request</text>

  <path d="M1075 395 H1305" fill="none" stroke="#414141" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1190" y="370" text-anchor="middle" fill="#414141" font-family="Arial, Helvetica, sans-serif" font-size="16">3. Read / write state</text>

  <path d="M1095 700 H1305" fill="none" stroke="#414141" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1200" y="675" text-anchor="middle" fill="#414141" font-family="Arial, Helvetica, sans-serif" font-size="16">4. Fetch Slack context</text>

  <path d="M1095 885 H1305" fill="none" stroke="#414141" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1200" y="860" text-anchor="middle" fill="#414141" font-family="Arial, Helvetica, sans-serif" font-size="16">5. Prompt + response</text>

  <path d="M635 855 H520 V840 H425" fill="none" stroke="#2D6A2D" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="530" y="825" text-anchor="middle" fill="#2D6A2D" font-family="Arial, Helvetica, sans-serif" font-size="16">6. Private threaded reply</text>

  <text x="90" y="1120" fill="#626262" font-family="Arial, Helvetica, sans-serif" font-size="17">Selected message and same-thread context are used first. RTS adds relevant workspace context when available.</text>
</svg>
